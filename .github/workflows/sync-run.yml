name: sync-run

# THE ONE PLACE THE SYNC'S ENVIRONMENT IS WRITTEN DOWN.
#
# Three workflows now run this service on a runner - the hourly full pass, the
# monthly re-read, and the manual date range. Each needs the same nineteen
# secrets. Three copies of that block is three places to edit when a setting is
# added, and the one that gets forgotten does not fail: the variable is simply
# EMPTY, and the job runs with a default nobody chose. That is the same
# "two places holding one fact" failure `0001` refuses in the schema.
#
# So the environment lives here once, and the callers pass a command.
#
# `secrets: inherit` rather than a listed mapping, deliberately: a mapping would
# reintroduce the per-caller list this file exists to delete.

on:
  workflow_call:
    inputs:
      command:
        description: The royalty-sync CLI command to run.
        required: true
        type: string
      args:
        description: Extra CLI arguments, e.g. --start=2026-01-01 --end=2026-03-31
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: Job timeout. Well under the platform six hours.
        required: false
        type: number
        default: 120

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: ${{ inputs.command }}
        env:
          # Hosts and keys are configuration. They are repository secrets and
          # never literals here - the same rule src/ and api/ are held to by
          # tests/no-hardcoded-config.
          APP_ENV: ${{ secrets.APP_ENV }}
          SECRETS_PROVIDER: env
          WL_API_HOST: ${{ secrets.WL_API_HOST }}
          WL_AUTH_HOST: ${{ secrets.WL_AUTH_HOST }}
          WL_ID_REGION: ${{ secrets.WL_ID_REGION }}
          WL_K_BUSINESS: ${{ secrets.WL_K_BUSINESS }}
          WL_CLIENT_ID: ${{ secrets.WL_CLIENT_ID }}
          WL_CLIENT_SECRET: ${{ secrets.WL_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GHL_API_HOST: ${{ secrets.GHL_API_HOST }}
          GHL_API_VERSION: ${{ secrets.GHL_API_VERSION }}
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          # Optional tuning. A secret that is not set arrives as an empty string
          # rather than as absent, which Zod would read as a bad value instead of
          # falling back - so each is defaulted here to the schema's own default.
          WL_MAX_CONCURRENCY: ${{ secrets.WL_MAX_CONCURRENCY || '5' }}
          HTTP_TIMEOUT_MS: ${{ secrets.HTTP_TIMEOUT_MS || '30000' }}
          LOG_LEVEL: info
        run: node dist/cli/main.js ${{ inputs.command }} ${{ inputs.args }}
